name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://dqrjxcyulzauoqhmnrho.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_l1fToIlW6Stqe48MYmhUPw_9D_PHnEg
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, unit tests and build
        run: npm run check

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
